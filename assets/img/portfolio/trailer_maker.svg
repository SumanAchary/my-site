  </defs>
  <rect width="600" height="400" rx="16" fill="url(#tmBg)"/>
  <rect x="1" y="1" width="598" height="398" rx="15" fill="none" stroke="#3498db" stroke-opacity="0.25" stroke-width="2"/>
  <rect x="48" y="150" width="64" height="6" rx="3" fill="url(#tmAccent)"/>
