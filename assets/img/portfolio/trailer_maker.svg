  <text x="50" y="248" font-family="'Open Sans',Arial,sans-serif" font-size="22" font-weight="600" fill="#9fb3c8">Random Video Clip Generator</text>
  <text x="50" y="284" font-family="'Open Sans',Arial,sans-serif" font-size="17" fill="#6f8296">Python &#183; MoviePy &#183; Automation</text>
  <g>
