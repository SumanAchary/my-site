<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Covid19 Notification">
  <defs>
    <linearGradient id="cvBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1622"/>
      <stop offset="1" stop-color="#12263b"/>
    </linearGradient>
    <linearGradient id="cvAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3498db"/>
      <stop offset="1" stop-color="#5fd0ff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#cvBg)"/>
  <rect x="1" y="1" width="598" height="398" rx="15" fill="none" stroke="#3498db" stroke-opacity="0.25" stroke-width="2"/>
  <rect x="48" y="150" width="64" height="6" rx="3" fill="url(#cvAccent)"/>
  <text x="48" y="205" font-family="'Poppins','Segoe UI',Arial,sans-serif" font-size="52" font-weight="700" fill="#ffffff">Covid19 <tspan fill="#3498db">Alerts</tspan></text>
  <text x="50" y="248" font-family="'Open Sans',Arial,sans-serif" font-size="22" font-weight="600" fill="#9fb3c8">Automated Notification System</text>
  <text x="50" y="284" font-family="'Open Sans',Arial,sans-serif" font-size="17" fill="#6f8296">Python &#183; Web Scraping &#183; Alerts</text>
  <g>
    <rect x="48" y="320" width="150" height="34" rx="17" fill="#3498db"/>
    <text x="66" y="342" font-family="'Open Sans',Arial,sans-serif" font-size="15" font-weight="700" fill="#0b1622">NOTIFICATIONS</text>
  </g>
  <!-- bell motif -->
  <g fill="#3498db" fill-opacity="0.12">
    <path d="M508 78 c-18 0 -30 12 -30 30 l0 22 l-10 12 l80 0 l-10 -12 l0 -22 c0 -18 -12 -30 -30 -30 z"/>
    <circle cx="508" cy="150" r="8"/>
  </g>
</svg>
