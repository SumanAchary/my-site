<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="QuickBytes - Full-Stack Platform">
  <defs>
    <linearGradient id="qbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1622"/>
      <stop offset="1" stop-color="#12263b"/>
    </linearGradient>
    <linearGradient id="qbAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3498db"/>
      <stop offset="1" stop-color="#5fd0ff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#qbBg)"/>
  <rect x="1" y="1" width="598" height="398" rx="15" fill="none" stroke="#3498db" stroke-opacity="0.25" stroke-width="2"/>
  <!-- accent bar -->
  <rect x="48" y="150" width="64" height="6" rx="3" fill="url(#qbAccent)"/>
  <!-- wordmark -->
  <text x="48" y="205" font-family="'Poppins','Segoe UI',Arial,sans-serif" font-size="58" font-weight="700" fill="#ffffff">Quick<tspan fill="#3498db">Bytes</tspan></text>
  <text x="50" y="248" font-family="'Open Sans',Arial,sans-serif" font-size="22" font-weight="600" fill="#9fb3c8">Full-Stack Platform on Google Cloud Run</text>
  <text x="50" y="284" font-family="'Open Sans',Arial,sans-serif" font-size="17" fill="#6f8296">FastAPI &#183; Next.js &#183; Firebase &#183; CI/CD</text>
  <!-- live pill -->
  <g>
    <rect x="48" y="320" width="150" height="34" rx="17" fill="#3498db"/>
    <circle cx="70" cy="337" r="5" fill="#0b1622"/>
    <text x="86" y="342" font-family="'Open Sans',Arial,sans-serif" font-size="15" font-weight="700" fill="#0b1622">LIVE SITE</text>
  </g>
  <!-- decorative cloud/braces motif -->
  <text x="470" y="120" font-family="'Fira Code',monospace" font-size="120" font-weight="700" fill="#3498db" fill-opacity="0.12">{ }</text>
</svg>
