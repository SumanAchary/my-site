<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Dino Bot">
  <defs>
    <linearGradient id="dbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1622"/>
      <stop offset="1" stop-color="#12263b"/>
    </linearGradient>
    <linearGradient id="dbAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3498db"/>
      <stop offset="1" stop-color="#5fd0ff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#dbBg)"/>
  <rect x="1" y="1" width="598" height="398" rx="15" fill="none" stroke="#3498db" stroke-opacity="0.25" stroke-width="2"/>
  <rect x="48" y="150" width="64" height="6" rx="3" fill="url(#dbAccent)"/>
  <text x="48" y="205" font-family="'Poppins','Segoe UI',Arial,sans-serif" font-size="54" font-weight="700" fill="#ffffff">Dino <tspan fill="#3498db">Bot</tspan></text>
  <text x="50" y="248" font-family="'Open Sans',Arial,sans-serif" font-size="22" font-weight="600" fill="#9fb3c8">Auto-Player for the Dino Game</text>
  <text x="50" y="284" font-family="'Open Sans',Arial,sans-serif" font-size="17" fill="#6f8296">Python &#183; Automation &#183; Image Detection</text>
  <g>
    <rect x="48" y="320" width="140" height="34" rx="17" fill="#3498db"/>
    <text x="66" y="342" font-family="'Open Sans',Arial,sans-serif" font-size="15" font-weight="700" fill="#0b1622">GAME BOT</text>
  </g>
  <!-- pixel dino motif -->
  <g fill="#3498db" fill-opacity="0.14">
    <rect x="500" y="70" width="52" height="40" rx="4"/>
    <rect x="540" y="60" width="24" height="24" rx="3"/>
    <rect x="492" y="110" width="16" height="24" rx="3"/>
    <rect x="536" y="110" width="16" height="24" rx="3"/>
  </g>
</svg>
